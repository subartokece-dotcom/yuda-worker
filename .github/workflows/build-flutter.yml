name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "ID job unik"
        required: true
        type: string
      userId:
        description: "User ID"
        required: false
        default: "0"
        type: string
      payload:
        description: "JSON string (mode, url, buildType, tag)"
        required: true
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.35.7"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PAYLOAD: ${{ inputs.payload }}

    steps:
      - name: Baca payload
        run: |
          printf '%s' "$PAYLOAD" > payload.json
          MODE=$(jq -r '.mode // "zip"' payload.json)
          SRC_URL=$(jq -r '.url // empty' payload.json)
          BUILD_TYPE=$(jq -r '.buildType // "release"' payload.json)

          if [ "$MODE" != "zip" ]; then
            echo "Mode '$MODE' belum didukung workflow ini"
            exit 1
          fi
          if [ -z "$SRC_URL" ]; then
            echo "URL kosong di payload"
            exit 1
          fi

          echo "SRC_URL=$SRC_URL" >> "$GITHUB_ENV"
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Download & extract source
        run: |
          curl -fL --retry 3 -o source.zip "$SRC_URL"

          SIZE=$(stat -c%s source.zip)
          if [ "$SIZE" -lt 1000 ]; then
            echo "File terlalu kecil ($SIZE byte), kemungkinan bukan ZIP"
            cat source.zip
            exit 1
          fi

          rm -rf project
          mkdir project
          unzip -q source.zip -d project

          PUBSPEC=$(find project -name pubspec.yaml | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml tidak ditemukan di dalam ZIP"
            exit 1
          fi

          echo "PROJ_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - name: Flutter info & pub get
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          flutter --version
          flutter pub get

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build APK
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Kumpulkan APK
        run: |
          mkdir -p out
          cp "$PROJ_DIR"/build/app/outputs/flutter-apk/*.apk out/
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: out/
          if-no-files-found: error
          retention-days: 3
